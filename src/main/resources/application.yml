server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: ticket-boot
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket_boot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: 场馆预约与核销系统

jwt:
  secret: ${JWT_SECRET}
  expire-seconds: 7200

ticket:
  upload:
    review-image-path: uploads/reviews
    review-image-url-prefix: /review-images
  order:
    timeout-scan-cron: "0 * * * * ?"
    timeout-batch-size: 50
    expire-minutes: 15
    close-delay-ms: 900000
  mq:
    order-timeout:
      enabled: false
