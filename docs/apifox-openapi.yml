      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 活动 ID
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 场次 ID
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 订单 ID
    pageNo:
      name: pageNo
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 1
        minimum: 1
      description: 页码，从 1 开始
    pageSize:
      name: pageSize
      in: query
      required: false
